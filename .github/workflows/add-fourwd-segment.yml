name: Add 4WD Segment

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

jobs:
  fourwd-segment:
    if: contains(github.event.issue.labels.*.name, 'fourwd-segment') || startsWith(github.event.issue.title, '[4WD]') || contains(github.event.issue.body, '### 4WD track title')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image tools
        run: pip install pillow

      - name: Apply 4WD segment issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: python scripts/add_fourwd_segment_from_issue.py

      - name: Regenerate 4WD tracks
        run: python process_fourwd.py

      - name: Commit 4WD segment update
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add fourwd_segments.json fourwd-tracks.geojson fourwd_stats.json fourwd-media
          git diff --cached --quiet && echo "No 4WD segment changes to commit" && exit 0
          git commit -m "Update 4WD segments from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const result = JSON.parse(fs.readFileSync("fourwd_result.json", "utf8"));
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${result.action === "updated" ? "Updated" : "Added"} 4WD segment **${result.title}** with id \`${result.id}\`.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
