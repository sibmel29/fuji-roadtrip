name: Fuji Mobile Sync

on:
  repository_dispatch:
    types: [mobile_sync_item]

permissions:
  contents: write

concurrency:
  group: fuji-mobile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply mobile item
        env:
          MOBILE_ITEM: ${{ toJson(github.event.client_payload.item) }}
        run: python scripts/apply_mobile_sync_item.py

      - name: Commit directly to main
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add poi.json fishing-log.json surf-log.json van-nights.geojson
          if git diff --cached --quiet; then
            echo "No new change (duplicate/retry)."
          else
            git commit -m "Add mobile sync item"
            git pull --rebase origin main
            git push origin main
          fi