name: Process Fuelio

on:
  push:
    paths:
      - 'fuelio/exports/*.csv'
      - 'fuelio/exports/*.CSV'
      - 'fuelio_log.json'
      - 'scripts/process_fuelio.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process Fuelio export
        run: python scripts/process_fuelio.py

      - name: Commit Fuelio stats
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add odo.json fuelio_stats.json
          git diff --cached --quiet && echo "No Fuelio changes to commit" && exit 0
          git commit -m "Update Fuelio stats"
          git push
