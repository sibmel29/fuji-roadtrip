name: Sync Komoot hikes

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-komoot-hikes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Import public Australian hikes
        run: python scripts/sync_komoot_hikes.py --user-id 1732805368253

      - name: Commit updated Komoot data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add komoot_hikes.geojson komoot_hikes_stats.json
          git diff --cached --quiet && echo "No Komoot hike changes to commit" && exit 0
          git commit -m "Sync public Komoot hikes"
          git push
