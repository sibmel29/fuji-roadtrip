name: Build Fuji Battery Bridge

on:
  workflow_dispatch: {}
  push:
    paths:
      - "fuji-battery-bridge/**"
      - ".github/workflows/build-fuji-battery-bridge.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuji-battery-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Fuji-Battery-Bridge-APK
          path: fuji-battery-bridge/app/build/outputs/apk/debug/app-debug.apk
